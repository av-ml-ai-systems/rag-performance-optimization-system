[project]
name = "rag-performance-optimization-system"
version = "0.1.0"
description = "A modular RAG system focused on measuring, analyzing, and optimizing retrieval, generation, latency, token usage, and resource efficiency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pyright",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.12"
strict = true